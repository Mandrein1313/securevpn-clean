<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เติมเงิน — SecureVPN</title>
  <link rel="stylesheet" href="css/portal.css">
</head>
<body class="portal">
  <div class="portal-wrap">
    <div class="top-nav">
      <a href="dashboard.html">← แดชบอร์ด</a>
      <span class="muted" id="balMini">฿0</span>
    </div>

    <div class="page-title">💳 เติมเงิน</div>

    <!-- แก้เบอร์/ชื่อบัญชีจริงใน config หรือตรงนี้ -->
    <div class="pay-info">
      <div class="muted">TrueMoney Wallet / โอนเงิน</div>
      <div class="phone" id="payPhone">000-000-0000</div>
      <div class="name" id="payName">ชื่อบัญชีรับเงิน</div>
      <p class="muted" style="margin:.6rem 0 0">โอนแล้วกรอกจำนวน + เลขอ้างอิงด้านล่าง แอดมินจะตรวจแล้วเติมเครดิต</p>
    </div>

    <div class="card">
      <form id="topupForm">
        <label class="field">ช่องทาง
          <select id="method">
            <option value="bank">โอนผ่านธนาคาร</option>
            <option value="truemoney">TrueMoney Wallet</option>
            <option value="gift">ซองอั่งเปา TrueMoney (วางลิงก์)</option>
          </select>
        </label>
        <label class="field">จำนวนเงิน (บาท)
          <input type="number" id="amount" min="10" step="1" required placeholder="เช่น 50">
        </label>
        <label class="field">เลขอ้างอิง / ลิงก์ซอง / เวลาโอน
          <input type="text" id="refCode" placeholder="เลขสลิป หรือ https://gift.truemoney.com/...">
        </label>
        <label class="field">หมายเหตุ (ถ้ามี)
          <textarea id="note" rows="2" placeholder="ชื่อบัญชีที่โอน ฯลฯ"></textarea>
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="btnSubmit">ส่งคำขอเติมเงิน</button>
        <p class="err" id="err"></p>
        <p class="ok" id="ok"></p>
      </form>
    </div>

    <h3 style="font-size:.95rem;margin:1rem 0 .5rem">ประวัติคำขอเติมเงิน</h3>
    <div id="list"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/wallet-store.js"></script>
  <script>
    (function () {
      // ตั้งค่าช่องทางรับเงิน — แก้ตรงนี้หรือใส่ใน config.js
      var PAY = window.SVPN_PAY || {
        phone: "096-000-0000",
        name: "ชื่อบัญชีรับเงิน (แก้ใน topup.html)"
      };
      document.getElementById("payPhone").textContent = PAY.phone;
      document.getElementById("payName").textContent = PAY.name;

      function esc(s) {
        return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;");
      }
      function statusBadge(st) {
        return '<span class="badge ' + esc(st) + '">' + esc({
          pending: "รอตรวจ", approved: "อนุมัติแล้ว", rejected: "ปฏิเสธ"
        }[st] || st) + "</span>";
      }
      function fmt(ts) {
        return ts ? new Date(Number(ts)).toLocaleString("th-TH", { dateStyle: "short", timeStyle: "short" }) : "";
      }

      async function refresh() {
        var w = await Store.getWallet();
        document.getElementById("balMini").textContent = "฿" + Number(w.balance).toFixed(2);
        var rows = await Store.listMyTopups();
        var box = document.getElementById("list");
        if (!rows.length) {
          box.innerHTML = '<p class="muted">ยังไม่มีคำขอ</p>';
          return;
        }
        box.innerHTML = rows.map(function (r) {
          return '<div class="list-item"><div class="row"><strong>฿' +
            Number(r.amount).toFixed(2) + "</strong>" + statusBadge(r.status) +
            "</div><div class=\"muted\">" + esc(r.method) + " · " + fmt(r.created_at) +
            (r.ref_code ? " · " + esc(r.ref_code) : "") + "</div></div>";
        }).join("");
      }

      document.getElementById("topupForm").onsubmit = async function (e) {
        e.preventDefault();
        var err = document.getElementById("err");
        var ok = document.getElementById("ok");
        err.textContent = ""; ok.textContent = "";
        var btn = document.getElementById("btnSubmit");
        btn.disabled = true;
        try {
          await Store.createTopup({
            amount: document.getElementById("amount").value,
            method: document.getElementById("method").value,
            refCode: document.getElementById("refCode").value,
            note: document.getElementById("note").value
          });
          ok.textContent = "ส่งคำขอแล้ว รอแอดมินอนุมัติ";
          document.getElementById("topupForm").reset();
          await refresh();
        } catch (ex) {
          err.textContent = ex.message || "ไม่สำเร็จ";
        } finally {
          btn.disabled = false;
        }
      };

      Store.getSession().then(function (s) {
        if (!s || !s.user) location.href = "login.html";
        else refresh().catch(function (e) {
          document.getElementById("err").textContent = e.message;
        });
      });
    })();
  </script>
</body>
</html>
